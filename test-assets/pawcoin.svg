<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Silver body -->
    <radialGradient id="silver" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e9ecf1"/>
      <stop offset="55%" stop-color="#b9bfc9"/>
      <stop offset="80%" stop-color="#8d94a0"/>
      <stop offset="100%" stop-color="#6c7380"/>
    </radialGradient>
    <!-- Rim: darker silver, lit from top-left -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="45%" stop-color="#a8afba"/>
      <stop offset="100%" stop-color="#5d6470"/>
    </linearGradient>
    <!-- Inner face -->
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fdfdfe"/>
      <stop offset="40%" stop-color="#d8dce3"/>
      <stop offset="100%" stop-color="#9aa1ad"/>
    </radialGradient>
    <!-- Purple paw -->
    <linearGradient id="purple" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#9b5de5"/>
      <stop offset="55%" stop-color="#6b2fb3"/>
      <stop offset="100%" stop-color="#43197a"/>
    </linearGradient>
    <!-- Shine sweep -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e0a3a" flood-opacity="0.55"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="coinClip"><circle cx="256" cy="256" r="236"/></clipPath>
    <path id="textArc" d="M 256 256 m -168 0 a 168 168 0 1 1 336 0"/>
    <path id="textArcBottom" d="M 256 256 m -166 0 a 166 166 0 0 0 332 0"/>
  </defs>

  <!-- Coin body and reeded edge -->
  <g filter="url(#drop)">
    <circle cx="256" cy="256" r="240" fill="url(#rim)"/>
    <circle cx="256" cy="256" r="240" fill="none" stroke="#7b828e" stroke-width="10" stroke-dasharray="3 4"/>
    <circle cx="256" cy="256" r="226" fill="url(#silver)"/>
  </g>

  <!-- Raised inner ring -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#f4f6f9" stroke-width="4" opacity="0.9"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#7a818d" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="url(#face)" stroke="#8a919d" stroke-width="3"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Lettering -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="10" fill="#4b2386" text-anchor="middle">
    <textPath href="#textArc" startOffset="50%">PAWCOIN</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="3" fill="#3f444c" text-anchor="middle" dominant-baseline="hanging">
    <textPath href="#textArcBottom" startOffset="50%">RIKER &amp; OLLIE'S WASTELAND</textPath>
  </text>
  <!-- Small stars between the two lines -->
  <g fill="#4b2386">
    <circle cx="70" cy="256" r="6"/>
    <circle cx="442" cy="256" r="6"/>
  </g>

  <!-- Purple paw -->
  <g fill="url(#purple)" stroke="#2e1056" stroke-width="2.5" filter="url(#emboss)">
    <!-- main pad -->
    <path d="M256 236
             C 292 236, 326 268, 330 300
             C 334 330, 310 346, 286 340
             C 272 336, 266 330, 256 330
             C 246 330, 240 336, 226 340
             C 202 346, 178 330, 182 300
             C 186 268, 220 236, 256 236 Z"/>
    <!-- toes -->
    <ellipse cx="190" cy="222" rx="24" ry="32" transform="rotate(-25 190 222)"/>
    <ellipse cx="232" cy="182" rx="25" ry="34" transform="rotate(-8 232 182)"/>
    <ellipse cx="280" cy="182" rx="25" ry="34" transform="rotate(8 280 182)"/>
    <ellipse cx="322" cy="222" rx="24" ry="32" transform="rotate(25 322 222)"/>
  </g>
  <!-- paw highlights -->
  <g fill="#ffffff" opacity="0.35">
    <ellipse cx="236" cy="262" rx="26" ry="10" transform="rotate(-20 236 262)"/>
    <ellipse cx="184" cy="210" rx="7" ry="11" transform="rotate(-25 184 210)"/>
    <ellipse cx="226" cy="168" rx="7" ry="12" transform="rotate(-8 226 168)"/>
    <ellipse cx="274" cy="168" rx="7" ry="12" transform="rotate(8 274 168)"/>
    <ellipse cx="316" cy="210" rx="7" ry="11" transform="rotate(25 316 210)"/>
  </g>

  <!-- Shine -->
  <g clip-path="url(#coinClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#shine)"/>
    <ellipse cx="180" cy="120" rx="120" ry="46" fill="#ffffff" opacity="0.28" transform="rotate(-30 180 120)"/>
  </g>
  <!-- sparkle -->
  <g fill="#ffffff">
    <path d="M420 150 l5 17 17 5 -17 5 -5 17 -5 -17 -17 -5 17 -5 z" opacity="0.95"/>
    <path d="M92 380 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3 z" opacity="0.8"/>
  </g>
</svg>
