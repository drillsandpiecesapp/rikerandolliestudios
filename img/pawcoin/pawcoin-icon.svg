<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Small-size PawCoin icon: no lettering, bigger paw, thicker rim. Use for 64 px and below. -->
  <defs>
    <radialGradient id="silver" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e9ecf1"/>
      <stop offset="55%" stop-color="#b9bfc9"/>
      <stop offset="80%" stop-color="#8d94a0"/>
      <stop offset="100%" stop-color="#6c7380"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="45%" stop-color="#a8afba"/>
      <stop offset="100%" stop-color="#4f5662"/>
    </linearGradient>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fdfdfe"/>
      <stop offset="45%" stop-color="#d8dce3"/>
      <stop offset="100%" stop-color="#a3aab5"/>
    </radialGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#a66cf0"/>
      <stop offset="55%" stop-color="#7033bd"/>
      <stop offset="100%" stop-color="#4a1c85"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e0a3a" flood-opacity="0.6"/>
    </filter>
    <clipPath id="coinClip"><circle cx="256" cy="256" r="236"/></clipPath>
  </defs>

  <!-- Thick rim -->
  <circle cx="256" cy="256" r="246" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#565d69" stroke-width="6"/>
  <circle cx="256" cy="256" r="214" fill="url(#silver)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#4f5662" stroke-width="8"/>

  <!-- Large face -->
  <circle cx="256" cy="256" r="196" fill="url(#face)"/>

  <!-- Purple paw, 1.55x the full coin's paw -->
  <g transform="translate(256 262) scale(1.55) translate(-256 -247)">
    <g fill="url(#purple)" stroke="#2e1056" stroke-width="3.5" filter="url(#emboss)">
      <path d="M256 236
               C 292 236, 326 268, 330 300
               C 334 330, 310 346, 286 340
               C 272 336, 266 330, 256 330
               C 246 330, 240 336, 226 340
               C 202 346, 178 330, 182 300
               C 186 268, 220 236, 256 236 Z"/>
      <ellipse cx="190" cy="222" rx="24" ry="32" transform="rotate(-25 190 222)"/>
      <ellipse cx="232" cy="182" rx="25" ry="34" transform="rotate(-8 232 182)"/>
      <ellipse cx="280" cy="182" rx="25" ry="34" transform="rotate(8 280 182)"/>
      <ellipse cx="322" cy="222" rx="24" ry="32" transform="rotate(25 322 222)"/>
    </g>
    <g fill="#ffffff" opacity="0.35">
      <ellipse cx="236" cy="262" rx="26" ry="10" transform="rotate(-20 236 262)"/>
      <ellipse cx="226" cy="168" rx="7" ry="12" transform="rotate(-8 226 168)"/>
      <ellipse cx="274" cy="168" rx="7" ry="12" transform="rotate(8 274 168)"/>
    </g>
  </g>

  <!-- Soft shine -->
  <g clip-path="url(#coinClip)">
    <ellipse cx="170" cy="110" rx="130" ry="50" fill="#ffffff" opacity="0.25" transform="rotate(-30 170 110)"/>
  </g>
</svg>
